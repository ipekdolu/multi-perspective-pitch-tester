<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>pitch tester (minimal UI)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  textarea { width: 100%; box-sizing: border-box; height: 5rem; font-family: inherit; }
  button { cursor: pointer; padding: 0.4rem 0.8rem; margin: 0.2rem 0.3rem 0.2rem 0; }
  .persona { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin: 0.6rem 0; }
  .persona h3 { margin: 0 0 0.4rem 0; text-transform: capitalize; }
  .msg { margin: 0.3rem 0; white-space: pre-wrap; }
  .msg.user { color: #a4470a; }
  .challenge-row { margin-top: 0.5rem; display: flex; gap: 0.4rem; }
  .challenge-row input[type=text] { flex: 1; }
  select { padding: 0.3rem; }
  #synthesis { background: #f5f5f5; border-radius: 6px; padding: 0.75rem; white-space: pre-wrap; }
  .section { margin-top: 1.5rem; }
  .hidden { display: none; }
  small { color: #666; }
</style>
</head>
<body>

<h1>Multi-perspective pitch tester</h1>
<small>Minimal UI for Phase 5 — full Vite/React frontend is Phase 6.</small>

<div id="start-section" class="section">
  <textarea id="pitch-input" placeholder="Describe your pitch..."></textarea>
  <button id="start-btn">Start</button>
</div>

<div id="run-section" class="section hidden">
  <div id="personas"></div>

  <div id="challenge-section" class="section hidden">
    <div class="challenge-row">
      <select id="challenge-persona"></select>
      <input type="text" id="challenge-text" placeholder="Challenge text...">
      <button id="challenge-btn">Send challenge</button>
    </div>
    <button id="done-btn">Done challenging</button>
  </div>

  <div id="approval-section" class="section hidden">
    <button id="approve-btn">Approve</button>
    <button id="reject-btn">Reject (another round)</button>
  </div>

  <div id="synthesis-section" class="section hidden">
    <h3>Synthesis</h3>
    <div id="synthesis"></div>
  </div>
</div>

<script>
let threadId = null;

function renderState(state) {
  document.getElementById('start-section').classList.add('hidden');
  document.getElementById('run-section').classList.remove('hidden');

  const personasDiv = document.getElementById('personas');
  personasDiv.innerHTML = '';
  const challengeSelect = document.getElementById('challenge-persona');
  challengeSelect.innerHTML = '';

  for (const [personaId, msgs] of Object.entries(state.persona_threads)) {
    const div = document.createElement('div');
    div.className = 'persona';
    const h3 = document.createElement('h3');
    h3.textContent = personaId;
    div.appendChild(h3);
    for (const m of msgs) {
      const p = document.createElement('div');
      p.className = 'msg ' + (m.role === 'user' ? 'user' : 'persona');
      p.textContent = (m.role === 'user' ? 'You: ' : '') + m.content;
      div.appendChild(p);
    }
    personasDiv.appendChild(div);

    const opt = document.createElement('option');
    opt.value = personaId;
    opt.textContent = personaId;
    challengeSelect.appendChild(opt);
  }

  const interrupted = state.interrupt;
  const challengeSection = document.getElementById('challenge-section');
  const approvalSection = document.getElementById('approval-section');
  challengeSection.classList.add('hidden');
  approvalSection.classList.add('hidden');

  if (interrupted && interrupted.type === 'present_findings') {
    challengeSection.classList.remove('hidden');
  } else if (interrupted && interrupted.type === 'human_approval_gate') {
    approvalSection.classList.remove('hidden');
  }

  const synthesisSection = document.getElementById('synthesis-section');
  if (state.synthesis) {
    synthesisSection.classList.remove('hidden');
    document.getElementById('synthesis').textContent = JSON.stringify(state.synthesis, null, 2);
  } else {
    synthesisSection.classList.add('hidden');
  }
}

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    alert('Request failed: ' + (await res.text()));
    throw new Error('request failed');
  }
  return res.json();
}

document.getElementById('start-btn').onclick = async () => {
  const pitch = document.getElementById('pitch-input').value.trim();
  if (!pitch) return;
  const state = await post('/runs', { pitch });
  threadId = state.thread_id;
  renderState(state);
};

document.getElementById('challenge-btn').onclick = async () => {
  const persona_id = document.getElementById('challenge-persona').value;
  const text = document.getElementById('challenge-text').value.trim();
  if (!text) return;
  const state = await post(`/runs/${threadId}/challenge`, { persona_id, text });
  document.getElementById('challenge-text').value = '';
  renderState(state);
};

document.getElementById('done-btn').onclick = async () => {
  const state = await post(`/runs/${threadId}/done`);
  renderState(state);
};

document.getElementById('approve-btn').onclick = async () => {
  const state = await post(`/runs/${threadId}/approve`);
  renderState(state);
};

document.getElementById('reject-btn').onclick = async () => {
  const state = await post(`/runs/${threadId}/reject`);
  renderState(state);
};
</script>

</body>
</html>
