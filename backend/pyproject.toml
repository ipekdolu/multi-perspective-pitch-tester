[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-tester-backend"
version = "0.1.0"
description = "Multi-perspective pitch tester — LangGraph backend"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "python-dotenv>=1.0.0",
    "mcp>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "langfuse>=4.15.0",
    "langchain>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
