[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-tester-backend"
version = "0.1.0"
description = "Multi-perspective pitch tester — LangGraph backend"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
