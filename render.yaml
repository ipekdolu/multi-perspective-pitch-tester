services:
  - name: pitch-tester-mcp
    type: web
    runtime: python
    region: oregon
    plan: free
    rootDir: mcp_server
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    # No healthCheckPath: /sse is a long-lived streaming connection that
    # never completes, so an HTTP health check against it never resolves
    # to "healthy" even though it returns 200. Omitting this falls back
    # to Render's plain TCP port-open check, which is all this needs.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # server.py's default (127.0.0.1) is only right for local dev --
      # without this, Render's port scanner can't see the service since
      # it only listens on localhost inside the container.
      - key: MCP_SERVER_HOST
        value: 0.0.0.0

  - name: pitch-tester-backend
    type: web
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      # Deliberately cheaper than the local default (claude-opus-5) --
      # this instance is reachable by anyone with the URL, so it
      # shouldn't default to the most expensive model. Override in the
      # Render dashboard if you want opus-5 quality for a specific demo.
      - key: PITCH_TESTER_MODEL
        value: claude-sonnet-5
      # Update this to match pitch-tester-mcp's actual assigned URL
      # after it first deploys (Render *should* follow <name>.onrender.com,
      # but confirm in the dashboard rather than assume).
      - key: MCP_SERVER_URL
        value: https://pitch-tester-mcp.onrender.com/sse
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: LANGFUSE_ONLINE_SAMPLE_RATE
        value: "0.2"
      # Set to the deployed Vercel frontend URL once that's live --
      # left blank/manual since it doesn't exist until after Vercel deploy.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
